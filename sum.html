<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMIS Analytics & Insights</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #b0c4de;
            --accent: #00e5ff;
            --accent-2: #ff4081;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Animated Shapes for Glass effect */
        .bg-shape { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; }
        .shape1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; opacity: 0.3; }
        .shape2 { width: 500px; height: 500px; background: var(--accent-2); bottom: -150px; right: -100px; opacity: 0.2; }

        /* Main Container */
        .dashboard { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header & Tabs */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border);
        }
        .header h1 { margin: 0; font-size: 2rem; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .header p { margin: 5px 0 0; color: var(--text-muted); }

        .tabs { display: flex; gap: 15px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; padding: 10px 25px; border-radius: 30px;
            font-family: 'Poppins'; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 4px 15px rgba(0,229,255,0.4); }

        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .glass-card {
            background: rgba(25, 35, 45, 0.4); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); transition: transform 0.3s;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.4); }
        
        .card-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; min-height: 40px; }
        .card-value { font-size: 2.2rem; font-weight: 700; margin: 0; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card-sub { font-size: 0.8rem; color: var(--accent); margin-top: 5px; }

        /* Full Width Chart Section */
        .chart-section {
            background: rgba(25, 35, 45, 0.4); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 25px; backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); position: relative;
            margin-bottom: 30px;
        }
        
        .chart-header-row {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;
        }

        .chart-title-box h2 { margin: 0; font-size: 1.3rem; font-weight: 600; color: var(--accent); }
        .chart-title-box p { margin: 5px 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .chart-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .chart-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer;
            transition: 0.3s; font-family: 'Poppins'; font-weight: 600; font-size: 0.9rem;
        }
        .chart-btn:hover:not(:disabled) { background: var(--accent); color: #000; border-color: var(--accent); }
        .chart-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .chart-indicator { font-size: 1rem; font-weight: 600; color: #fff; min-width: 60px; text-align: center; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px;}

        .canvas-container { height: 450px; width: 100%; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 32, 39, 0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--glass-border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .chart-header-row { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <div id="loader">
        <div class="spinner"></div>
        <h2 id="loader-text" style="font-weight: 300; letter-spacing: 2px;">Connecting Database...</h2>
    </div>

    <div class="dashboard">
        <div class="header">
            <div>
                <h1>HMIS Master Analytics</h1>
                <p>Comprehensive Data Visualization for Aizawl East District</p>
            </div>
            <div class="tabs">
                <button class="tab-btn active" id="tab-ANC" onclick="loadTab('ANC')">Ante Natal Care (ANC)</button>
                <button class="tab-btn" id="tab-Immunization" onclick="loadTab('Immunization')">Child Immunization</button>
            </div>
        </div>

        <div class="summary-grid" id="summaryCards"></div>

        <div class="chart-section">
            <div class="chart-header-row">
                <div class="chart-title-box">
                    <h2 id="chartMainTitle">Top 5 Facilities Comparison</h2>
                    <p id="chartSubTitle">Category: Loading...</p>
                </div>
                <div class="chart-controls">
                    <button class="chart-btn" id="prevChartBtn" onclick="changeChartCategory(-1)">&#8592; Prev</button>
                    <div class="chart-indicator" id="chartIndicator">0/0</div>
                    <button class="chart-btn" id="nextChartBtn" onclick="changeChartCategory(1)">Next &#8594;</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="dynamicBarChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzX54Nbo87lqCVreZ3aT556CkUEOnzWUq-_idBk-y6Ey8DeOE1ITzr5YJ5yKCZOS8J60w/exec';
        
        let barChartInst = null;
        let currentTab = '';
        
        let globalParsedData = [];
        let chartCategories = []; 
        let currentCategoryIndex = 0;

        function loadTab(sheetName) {
            // Update Tab Button UI safely
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            let activeBtn = document.getElementById('tab-' + sheetName);
            if(activeBtn) activeBtn.classList.add('active');
            
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('loader-text').innerText = `Analyzing [${sheetName}]...`;
            currentTab = sheetName;

            const callbackName = 'processJSONP_' + Math.floor(Math.random() * 100000);
            
            let timeoutId = setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                alert("Connection Timeout! I Google Sheet-ah '" + sheetName + "' tih Tab hi a awm ngei em check rawh.");
            }, 10000);

            window[callbackName] = function(data) {
                clearTimeout(timeoutId); 
                analyzeData(data);
                delete window[callbackName];
            };

            var script = document.createElement('script');
            script.src = `${SCRIPT_URL}?sheetName=${encodeURIComponent(sheetName)}&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        function analyzeData(data) {
            document.getElementById('loader').style.display = 'none';
            if(data.error) { 
                alert("Error: " + data.error + "\nGoogle Sheet Tab hming a inmil lo."); 
                return; 
            }

            const values = data.values;
            if(!values || values.length < 3) return;

            // SMART HEADER DETECTION
            let dataStart = 1, headIdx = 0;
            for(let i=0; i<values.length; i++) {
                let cell0 = values[i][0] ? values[i][0].toString().trim().toLowerCase() : "";
                if(cell0 !== "" && cell0 !== "facility name" && cell0 !== "sl. no" && cell0 !== "sl.no" && i > 0) {
                    dataStart = i; 
                    break;
                }
            }
            
            for(let i = dataStart - 1; i >= 0; i--) {
                if(!values[i]) continue;
                let cell1 = values[i][1] ? values[i][1].toString().trim() : "";
                let cell2 = values[i][2] ? values[i][2].toString().trim() : "";
                if(cell1 !== "" || cell2 !== "") {
                    headIdx = i;
                    break;
                }
            }

            const headers = values[headIdx];
            globalParsedData = []; 

            for(let r = dataStart; r < values.length; r++) {
                if(!values[r][0] || values[r][0].toString().trim() === "") continue;
                
                let rowData = { facility: values[r][0], data: {} };
                for(let c = 1; c < headers.length; c++) {
                    let hName = headers[c] ? headers[c].toString().trim() : `Col${c}`;
                    let cellValue = values[r][c];
                    
                    if(typeof cellValue === 'string') cellValue = cellValue.replace('%', '').replace(',', '');
                    let val = parseFloat(cellValue);
                    
                    rowData.data[hName] = isNaN(val) ? 0 : val; 
                }
                globalParsedData.push(rowData);
            }

            setupDashboard(headers);
        }

        function findColKey(headers, keyword) {
            return headers.find(h => h && h.toLowerCase().includes(keyword.toLowerCase()));
        }

        function setupDashboard(headers) {
            let isANC = currentTab === 'ANC' || currentTab.includes('Ante');
            let isImmu = currentTab.includes('Immu');

            let rawCategories = [];

            // KIMCHANG TAKA CATEGORY THLIARHRANNA
            if(isANC) {
                rawCategories = [
                    { title: "New Registered PW", key: findColKey(headers, "registered for anc") },
                    { title: "1st Trimester Registration", key: findColKey(headers, "1st trimester") },
                    { title: "Total ANC Footfall", key: findColKey(headers, "footfall") },
                    { title: "Received 4+ Checkups", key: findColKey(headers, "4 or more anc") },
                    { title: "180 IFA Tablets Given", key: findColKey(headers, "180 iron") || findColKey(headers, "ifa") },
                    { title: "360 Calcium Tablets Given", key: findColKey(headers, "360 calcium") },
                    { title: "Hb Tests Conducted", key: findColKey(headers, "haemoglobin") },
                    { title: "Severe Anemia (Hb < 7)", key: findColKey(headers, "<=7") || findColKey(headers, "7 g/dl") }
                ];
            } else if (isImmu) {
                rawCategories = [
                    { title: "Total BCG Given", key: findColKey(headers, "bcg") },
                    { title: "OPV 0 (Birth Dose)", key: findColKey(headers, "opv 0") },
                    { title: "Hepatitis-B0 (Birth Dose)", key: findColKey(headers, "hepatitis-b0") },
                    { title: "Pentavalent 1", key: findColKey(headers, "pentavalent 1") },
                    { title: "Pentavalent 3", key: findColKey(headers, "pentavalent 3") },
                    { title: "Measles & Rubella 1st", key: findColKey(headers, "measles") || findColKey(headers, "mcv") },
                    { title: "Rotavirus 1", key: findColKey(headers, "rotavirus 1") },
                    { title: "Fully Immunized", key: findColKey(headers, "fully") }
                ];
            } else {
                rawCategories = [
                    { title: headers[1] ? headers[1].substring(0,25) : "Metric 1", key: headers[1] }, 
                    { title: headers[2] ? headers[2].substring(0,25) : "Metric 2", key: headers[2] },
                    { title: headers[3] ? headers[3].substring(0,25) : "Metric 3", key: headers[3] }, 
                    { title: headers[4] ? headers[4].substring(0,25) : "Metric 4", key: headers[4] }
                ];
            }

            // Filter out any categories that were not found in the actual sheet headers
            chartCategories = rawCategories.filter(cat => cat.key !== undefined);

            // 1. Render Top 4 Summary Cards (Takes the first 4 successful categories)
            let cardsHTML = "";
            let top4Categories = chartCategories.slice(0, 4);
            
            top4Categories.forEach(cat => {
                let total = globalParsedData.reduce((sum, row) => sum + (row.data[cat.key] || 0), 0);
                let formattedTotal = total % 1 !== 0 ? total.toFixed(1) : total.toLocaleString();

                cardsHTML += `
                <div class="glass-card">
                    <div class="card-title" title="${cat.key}">${cat.title}</div>
                    <h2 class="card-value">${formattedTotal}</h2>
                    <div class="card-sub">District Total</div>
                </div>`;
            });
            document.getElementById('summaryCards').innerHTML = cardsHTML;

            // 2. Setup Dynamic Chart
            currentCategoryIndex = 0;
            if(chartCategories.length > 0) {
                updateChartUI();
            } else {
                document.getElementById('chartSubTitle').innerText = "No data columns found to chart.";
            }
        }

        function changeChartCategory(direction) {
            currentCategoryIndex += direction;
            if(currentCategoryIndex < 0) currentCategoryIndex = 0;
            if(currentCategoryIndex >= chartCategories.length) currentCategoryIndex = chartCategories.length - 1;
            updateChartUI();
        }

        function updateChartUI() {
            if(chartCategories.length === 0) return;

            let currentCat = chartCategories[currentCategoryIndex];
            
            // Update UI Texts
            document.getElementById('chartSubTitle').innerText = "Category: " + currentCat.title;
            document.getElementById('chartIndicator').innerText = `${currentCategoryIndex + 1} / ${chartCategories.length}`;
            
            // Update Button States
            document.getElementById('prevChartBtn').disabled = (currentCategoryIndex === 0);
            document.getElementById('nextChartBtn').disabled = (currentCategoryIndex === chartCategories.length - 1);

            // Sort and Get Top 5 Sub-Centres for this specific category
            let sortedData = [...globalParsedData].sort((a, b) => (b.data[currentCat.key] || 0) - (a.data[currentCat.key] || 0));
            
            let topLabels = sortedData.slice(0, 5).map(d => d.facility.replace(' SC', ''));
            let topValues = sortedData.slice(0, 5).map(d => d.data[currentCat.key] || 0);

            renderBarChart(topLabels, topValues, currentCat.title);
        }

        function renderBarChart(labels, dataValues, labelName) {
            Chart.defaults.color = '#b0c4de';
            Chart.defaults.font.family = 'Poppins';

            if(barChartInst) barChartInst.destroy();

            const ctx = document.getElementById('dynamicBarChart').getContext('2d');
            
            let gradientBar = ctx.createLinearGradient(0, 0, 0, 400);
            gradientBar.addColorStop(0, '#00e5ff');
            gradientBar.addColorStop(1, '#ff4081');

            barChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelName,
                        data: dataValues,
                        backgroundColor: gradientBar,
                        borderRadius: 8,
                        borderWidth: 0,
                        barThickness: 45 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 15, weight: 'bold' },
                            padding: 12
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { font: { size: 13 } }
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { font: { size: 13, weight: '600' }, color: '#fff' } 
                        }
                    },
                    animation: { duration: 600, easing: 'easeOutQuart' }
                }
            });
        }

        // TUNA I SHTEET HMING CHIAH CHIAH ("ANC") KAN HAWN TIR TAWH E
        window.onload = () => loadTab('ANC'); 
    </script>
</body>
</html>
